# Throwaway: how does Antigravity CLI install and ask for sign-in on a GitHub runner?
name: agy diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "--- candidates"; ls -la "$HOME/.local/bin" "$HOME/.antigravity/antigravity/bin" 2>/dev/null || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.antigravity/antigravity/bin" >> "$GITHUB_PATH"
      - name: Version
        run: command -v agy && agy --version
      - name: A. print mode, stdin=/dev/null
        run: |
          redact() { sed -E 's/(client_id|state|code_challenge|nonce)=[^& ]+/\1=<r>/g'; }
          ( time timeout 75 agy -p "Reply with OK" < /dev/null 2>&1 | redact | cut -c1-400 ) || true
      - name: B. print mode under a pseudo-terminal, no CI variables
        run: |
          redact() { sed -E 's/(client_id|state|code_challenge|nonce)=[^& ]+/\1=<r>/g'; }
          ( env -u CI -u GITHUB_ACTIONS timeout 25 script -qefc 'agy -p "Reply with OK"' /dev/null 2>&1 | redact | tr -d '\000-\010\013-\037' | cut -c1-400 | head -40 ) || true
      - name: C. remote-control and state
        run: |
          ( timeout 20 agy remote-control status 2>&1 | cut -c1-300 ) || true
          echo "--- state dirs"; find "$HOME/.gemini" "$HOME/.config" -maxdepth 3 2>/dev/null | head -40
          echo "--- keyring?"; command -v gnome-keyring-daemon secret-tool dbus-launch || true

# Runs the Antigravity agent for this repository without any computer.
# Start it from the Actions tab, scan the QR code from the job log with the
# Antigravity app, then chat from your phone. Compute is billed to this
# repository's GitHub Actions minutes; model usage to your own Google account.
name: Antigravity Agent

on:
  workflow_dispatch:
    inputs:
      pair:
        description: Pairing id created by the Antigravity app (leave empty to get a QR code)
        required: false
      token:
        description: One-time pairing token
        required: false
      expires:
        description: Invitation expiry (unix seconds)
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: antigravity-agent
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install agent tools
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/agent" node-pty@1.1.0 qrcode-terminal@0.12.0
          cp .antigravity/cloud/bridge.mjs .antigravity/cloud/start-cloud-bridge.mjs "$RUNNER_TEMP/agent/"

      - name: Configure git author
        run: |
          git config user.name "Antigravity Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run agent (scan the QR code printed below)
        env:
          ANTIGRAVITY_PAIR_ID: ${{ inputs.pair }}
          ANTIGRAVITY_PAIR_TOKEN: ${{ inputs.token }}
          ANTIGRAVITY_PAIR_EXPIRES: ${{ inputs.expires }}
        run: node "$RUNNER_TEMP/agent/start-cloud-bridge.mjs"
